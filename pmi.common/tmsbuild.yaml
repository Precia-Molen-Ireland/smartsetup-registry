# TMS Smart Setup definition for the PMI common units repo ("common", formerly "misc").
# Install with:  tms install pmi.common   (server "pmi", see Precia-Molen-Ireland/smartsetup-registry)
#
# This repo is mostly source-only units with mixed dependencies (TMS Logging, CodeSite,
# Raize, QuickLogger, FMX). They are compiled by the projects that use them, so their
# folders are simply registered on the library path (see "paths" below). jsonadapt is a
# real package; so are the PM Theme packages (PMThemeCore, PMThemeVCL, PMThemeFMX and the
# design packages dclPMThemeVCL / dclPMThemeFMX), which put TPMThemeVCL and TPMThemeFMX on
# the IDE's palette - the apps still compile the theme units from source.
minimum required tmsbuild version: 2.0

application:
  id: pmi.common
  name: PMI Common Units
  description: Shared Delphi units used across GenWS, GenMobile and other PMI projects (loggers, helpers, JSON adapter, the PM Light / PM Dark theme)
  url: https://github.com/Precia-Molen-Ireland/common.git
  vcs protocol: git
  docs: https://github.com/Precia-Molen-Ireland/common

# The units are used by GenMobile on every platform it targets, so the library
# path is registered for all of them. jsonadapt is RTL/dbrtl only and builds anywhere.
supported frameworks:
  rtl:
    ide since: delphi11
    platforms:
      - win32intel
      - win64intel
      - win64xintel
      - macos64arm
      - iosdevice64
      - iossimulator64arm
      - android64
    # Smart Setup only builds win64xintel when this is true.
    c++ builder support: true
  # The PM Theme components: TPMThemeVCL (Windows only) and TPMThemeFMX (everywhere).
  vcl:
    ide since: delphi11
    platforms:
      - win32intel
      - win64intel
      - win64xintel
    c++ builder support: true
  fmx:
    ide since: delphi11
    platforms:
      - win32intel
      - win64intel
      - win64xintel
      - macos64arm
      - iosdevice64
      - iossimulator64arm
      - android64
    c++ builder support: true

packages:
  - jsonadapt: [runtime, rtl]
  - PMThemeCore: [runtime, rtl]
  - PMThemeVCL: [runtime, vcl]
  - PMThemeFMX: [runtime, fmx]
  - dclPMThemeVCL: [design, vcl]
  - dclPMThemeFMX: [design, fmx]

package options:
  # The packages have no {$LIBSUFFIX}; Smart Setup adds one at build time.
  add libsuffix: true
  # The .dproj files list only Win32; build them for every platform above anyway.
  ignore dproj platforms: true

paths:
  # Everything else is consumed as source. These folders are relative to the repo root,
  # which Smart Setup checks out to <tms products folder>\pmi.common\src - here,
  # C:\Delphi\Comps\tms\Products\pmi.common\src.
  extra library paths:
    - .
    - Logging
    # The Precia Molen theme: its units link their own resources (PMTheme.res).
    - Theme
