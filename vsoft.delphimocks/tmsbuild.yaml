# TMS Smart Setup definition for Delphi-Mocks (https://github.com/VSoftTechnologies/Delphi-Mocks).
# Upstream, unmodified. The vendor dproj lists Delphi.Mocks.inc as a DCCReference, which
# Smart Setup rejects ("Unsupported DCC reference file type"), so the package is generated
# from the Source folder instead of using the vendor package.
minimum required tmsbuild version: 2.0

application:
  id: vsoft.delphimocks
  name: Delphi Mocks
  description: Delphi-Mocks mocking framework for unit tests (VSoft Technologies)
  url: https://github.com/VSoftTechnologies/Delphi-Mocks
  vcs protocol: git
  docs: https://github.com/VSoftTechnologies/Delphi-Mocks

supported frameworks:
  rtl:
    ide since: delphi11
    platforms:
      - win32intel
      - win64intel

packages:
  - DelphiMocks: [runtime, rtl]

package definitions:
  DelphiMocks:
    framework type: NONE
    description: Delphi-Mocks mocking framework
    requires: rtl
    files:
      - source:
          folder: Source
          include file mask: '*.pas'

paths:
  # Delphi.Mocks.inc is included by the units and lives next to them.
  build-only library paths:
    - Source
