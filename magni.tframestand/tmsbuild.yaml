# TMS Smart Setup definition for TFrameStand (https://github.com/andrea-magni/TFrameStand).
# Upstream, unmodified; the repo ships no tmsbuild.yaml so this copy is used.
minimum required tmsbuild version: 2.0

application:
  id: magni.tframestand
  name: TFrameStand
  description: TFrameStand / TFormStand FMX components for frame and form management (Andrea Magni)
  url: https://github.com/andrea-magni/TFrameStand
  vcs protocol: git
  docs: https://github.com/andrea-magni/TFrameStand

# The package names carry the Delphi version (FrameStandPackage_13), so this definition
# targets Delphi 13 only. Add a "delphi14" mapping and rename when the next version ships.
supported frameworks:
  fmx:
    ide since: delphi13
    platforms:
      - win32intel
      - win64intel
      - android64
      - iosdevice64
      - iossimulator64arm
      - macos64arm

packages:
  - FrameStandPackage_13: [runtime, fmx]
  - dclFrameStandPackage_13: [design, fmx]

package options:
  # All versions' packages sit flat in packages\; the dproj omits iOS but the code is plain FMX.
  # Note: "delphi13+" makes Smart Setup 2.x fail with "Range check error" while loading the
  # server (plus-form on the newest IDE it knows), so the mapping is written without the plus.
  package folders:
    delphi13: packages
  ignore dproj platforms: true

paths:
  extra library paths:
    - source
