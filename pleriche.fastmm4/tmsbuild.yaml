# TMS Smart Setup definition for FastMM4 (https://github.com/pleriche/FastMM4).
# Upstream, unmodified. FastMM4.pas must be compiled into the program that uses it (it
# cannot live in a package: E2201 on Win32), so the projects take it from source via the
# library path. The generated package holds only FastMM4Messages and exists because Smart
# Setup requires at least one package per product.
minimum required tmsbuild version: 2.0

application:
  id: pleriche.fastmm4
  name: FastMM4
  description: FastMM4 memory manager with leak detection (Pierre le Riche)
  url: https://github.com/pleriche/FastMM4
  vcs protocol: git
  docs: https://github.com/pleriche/FastMM4

supported frameworks:
  rtl:
    ide since: delphi11
    platforms:
      - win32intel
      - win64intel

packages:
  - FastMM4Support: [runtime, rtl]

package definitions:
  FastMM4Support:
    framework type: NONE
    description: FastMM4 messages unit (FastMM4.pas itself is compiled by the consuming program)
    requires: rtl
    files:
      - source:
          folder: .
          include file mask: 'FastMM4Messages.pas'

paths:
  # FastMM4Options.inc lives in the repo root and is included by FastMM4.pas.
  extra library paths:
    - .
